
<style>
  :root {
    --navy: #17365d;
    --blue: #2563eb;
    --blue-light: #eff6ff;
    --green: #15803d;
    --green-light: #f0fdf4;
    --red: #b91c1c;
    --red-light: #fef2f2;
    --amber: #b45309;
    --amber-light: #fffbeb;
    --text: #1e293b;
    --muted: #64748b;
    --border: #e2e8f0;
    --surface: #ffffff;
    --background: #f1f5f9;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: var(--background);
    color: var(--text);
    font-size: 14px;
    line-height: 1.5;
  }

  header {
    background: linear-gradient(120deg, #122b4a, #24558b);
    color: #fff;
    padding: 30px max(22px, calc((100% - 1180px) / 2));
    border-bottom: 4px solid #60a5fa;
  }

  header h1 {
    margin: 0 0 6px;
    font-size: clamp(24px, 3vw, 34px);
    letter-spacing: -0.6px;
  }

  header p {
    margin: 0;
    color: #dbeafe;
    font-size: 15px;
  }

  main {
    max-width: 1220px;
    margin: 26px auto 50px;
    padding: 0 22px;
  }

  .back-link {
    display: inline-flex;
    align-items: center;
    margin-bottom: 22px;
    color: #1d4ed8;
    font-weight: 700;
    text-decoration: none;
  }

  .back-link:hover {
    text-decoration: underline;
  }

  .panel {
    background: var(--surface);
    padding: 24px;
    margin-bottom: 22px;
    border: 1px solid #e5eaf1;
    border-radius: 15px;
    box-shadow: 0 4px 18px rgba(15, 23, 42, 0.045);
    min-width: 0;
  }

  .panel > h2 {
    font-size: 19px;
    margin: 0 0 20px;
    color: #172b4d;
    letter-spacing: -0.25px;
  }

  .panel > h3 {
    font-size: 16px;
    margin: 28px 0 14px;
    color: #334155;
  }

  .filters {
    display: flex;
    flex-wrap: wrap;
    align-items: end;
    gap: 12px;
  }

  .form-group {
    display: flex;
    flex-direction: column;
    gap: 7px;
  }

  label {
    font-weight: 700;
    color: #475569;
  }

  input,
  button {
    min-height: 42px;
    padding: 10px 13px;
    border-radius: 8px;
    font: inherit;
  }

  input {
    border: 1px solid #cbd5e1;
    background: #fff;
    color: var(--text);
  }

  input:focus {
    outline: 3px solid #bfdbfe;
    border-color: var(--blue);
  }

  .btn {
    border: 0;
    cursor: pointer;
    color: #fff;
    background: var(--blue);
    font-weight: 700;
    transition: filter 0.2s, transform 0.2s;
  }

  .btn:hover {
    filter: brightness(0.92);
    transform: translateY(-1px);
  }

  .btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    transform: none;
  }

  #exportPDF {
    background: #b91c1c;
  }

  #exportExcel {
    background: #15803d;
  }

  .status {
    margin: 17px 0 0;
    color: var(--muted);
    overflow-wrap: anywhere;
  }

  .notice {
    background: var(--blue-light);
    color: #1e40af;
    border-left: 4px solid #3b82f6;
    border-radius: 8px;
    padding: 13px 15px;
    margin-top: 16px;
    line-height: 1.6;
  }

  .summary {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 15px;
  }

  .metric {
    position: relative;
    min-width: 0;
    padding: 20px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: #fff;
    overflow: hidden;
  }

  .metric::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 4px;
    background: #94a3b8;
  }

  .metric p {
    margin: 0 0 10px;
    color: var(--muted);
    font-size: 13px;
  }

  .metric h2 {
    margin: 0;
    font-size: clamp(19px, 2vw, 25px);
    line-height: 1.3;
    font-weight: 750;
    overflow-wrap: anywhere;
    letter-spacing: -0.5px;
  }

  .metric .metric-detail {
    margin: 12px 0 0;
    font-size: 12px;
    line-height: 1.5;
    color: var(--muted);
  }

  .metric-percent {
    font-weight: 700;
    color: var(--blue);
  }

  /* Resumo mensal */
  main > section.panel:nth-of-type(2) .metric:nth-child(1)::before {
    background: var(--green);
  }

  main > section.panel:nth-of-type(2) .metric:nth-child(1) h2 {
    color: var(--green);
  }

  main > section.panel:nth-of-type(2) .metric:nth-child(2)::before {
    background: var(--red);
  }

  main > section.panel:nth-of-type(2) .metric:nth-child(2) h2 {
    color: var(--red);
  }

  main > section.panel:nth-of-type(2) .metric:nth-child(3)::before {
    background: var(--blue);
  }

  main > section.panel:nth-of-type(2) .metric:nth-child(4)::before {
    background: #7c3aed;
  }

  /* Resumo das dívidas */
  main > section.panel:nth-of-type(3) {
    border-top: 4px solid #64748b;
  }

  main > section.panel:nth-of-type(3) > h2 {
    margin-bottom: 8px;
  }

  main > section.panel:nth-of-type(3) > .status {
    margin: 0 0 20px;
    line-height: 1.7;
  }

  main > section.panel:nth-of-type(3) .metric {
    background: #f8fafc;
  }

  main > section.panel:nth-of-type(3) .metric:nth-child(1)::before {
    background: var(--red);
  }

  main > section.panel:nth-of-type(3) .metric:nth-child(1) h2 {
    color: var(--red);
  }

  main > section.panel:nth-of-type(3) .metric:nth-child(2)::before {
    background: var(--green);
  }

  main > section.panel:nth-of-type(3) .metric:nth-child(2) h2 {
    color: var(--green);
  }

  main > section.panel:nth-of-type(3) .metric:nth-child(3)::before {
    background: var(--amber);
  }

  main > section.panel:nth-of-type(3) .metric:nth-child(3) h2 {
    color: var(--amber);
  }

  main > section.panel:nth-of-type(3) .metric:nth-child(4)::before {
    background: var(--blue);
  }

  main > section.panel:nth-of-type(3) .metric:nth-child(4) h2 {
    color: var(--blue);
  }

  .chart-container {
    position: relative;
    height: 320px;
    max-width: 100%;
  }

  .table-wrap {
    width: 100%;
    overflow-x: auto;
    border: 1px solid var(--border);
    border-radius: 10px;
  }

  table {
    width: 100%;
    min-width: 560px;
    border-collapse: collapse;
    margin: 0;
    background: #fff;
  }

  th,
  td {
    text-align: left;
    padding: 13px 14px;
    border-bottom: 1px solid #edf0f5;
    vertical-align: middle;
  }

  th {
    background: #f1f5f9;
    color: #334155;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.35px;
    white-space: nowrap;
  }

  td {
    color: #475569;
  }

  tbody tr:last-child td {
    border-bottom: 0;
  }

  tbody tr:hover {
    background: #f8fafc;
  }

  .positive {
    color: var(--green);
  }

  .negative {
    color: var(--red);
  }

  /* Realçar o quadro de estado das dívidas */
  #debtsTable td:first-child {
    font-weight: 700;
    color: #334155;
  }

  #debtsTable td:nth-child(4),
  #debtsTable td:nth-child(5),
  #debtsTable td:nth-child(6) {
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  #categoryTable td:last-child,
  #movementsTable td:last-child {
    font-weight: 700;
    white-space: nowrap;
  }

  #movementsTable td:nth-child(4) {
    font-weight: 700;
  }

  @media (max-width: 900px) {
    .summary {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .panel {
      padding: 20px;
    }

    .chart-container {
      height: 290px;
    }
  }

  @media (max-width: 600px) {
    header {
      padding: 24px 18px;
    }

    main {
      margin-top: 18px;
      padding: 0 12px;
    }

    .panel {
      padding: 16px;
      margin-bottom: 15px;
      border-radius: 12px;
    }

    .panel > h2 {
      font-size: 17px;
      margin-bottom: 16px;
    }

    .summary {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .metric {
      padding: 14px 12px;
      border-radius: 10px;
    }

    .metric p {
      font-size: 12px;
    }

    .metric h2 {
      font-size: 18px;
    }

    .metric .metric-detail {
      font-size: 11px;
    }

    .filters {
      align-items: stretch;
    }

    .filters > * {
      width: 100%;
    }

    .form-group input {
      width: 100%;
    }

    .chart-container {
      height: 260px;
    }

    th,
    td {
      padding: 10px;
    }
  }

  @media print {
    body {
      background: #fff;
    }

    header {
      background: #fff;
      color: #17365d;
      padding: 15px 0;
      border-bottom: 2px solid #17365d;
    }

    header p {
      color: #475569;
    }

    main {
      max-width: 100%;
      margin: 10px auto;
      padding: 0;
    }

    .back-link,
    .filters,
    .notice,
    #reportStatus {
      display: none !important;
    }

    .panel {
      box-shadow: none;
      break-inside: avoid;
      border: 1px solid #d1d5db;
      padding: 14px;
      margin-bottom: 14px;
    }

    .summary {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .metric {
      break-inside: avoid;
    }

    .table-wrap {
      overflow: visible;
    }

    table {
      min-width: 0;
      font-size: 10px;
    }

    th,
    td {
      padding: 6px;
    }

    .chart-container {
      height: 240px;
    }
  }
</style>
